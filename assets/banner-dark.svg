<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">Ferhat Hacıosmanoğlu</title>
  <desc id="desc">Mekatronik Mühendisi · PWA ve İş Uygulamaları Geliştirici</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8530a"/><stop offset=".5" stop-color="#ff7a2a"/><stop offset="1" stop-color="#ffb26b"/>
    </linearGradient>
    <linearGradient id="icon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6a1a"/><stop offset="1" stop-color="#ffb26b"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1280" height="400" rx="24"/></clipPath>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".05"/>
    </pattern>
    <radialGradient id="fade" cx="72%" cy="35%" r="75%">
      <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMask"><rect width="1280" height="400" fill="url(#fade)"/></mask>
    <radialGradient id="orbA">
