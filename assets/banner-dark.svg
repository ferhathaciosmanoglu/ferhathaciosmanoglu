        <animate attributeName="width" values="0.0;11.4;22.8;34.2;45.6;57.0;68.4;79.8;91.2;102.6;114.0;125.4;136.8;148.2;159.6;171.0;182.4;193.8;205.2;216.6;228.0;239.4;250.8;262.2;273.6;285.0;296.4;307.8;319.2;330.6;342.0;353.4;364.8;376.2;387.6;399.0;410.4;421.8;433.2;444.6;456.0;467.4;478.8;490.2;501.6;513.0;524.4;535.8" keyTimes="0.0;0.0213;0.0426;0.0638;0.0851;0.1064;0.1277;0.1489;0.1702;0.1915;0.2128;0.234;0.2553;0.2766;0.2979;0.3191;0.3404;0.3617;0.383;0.4043;0.4255;0.4468;0.4681;0.4894;0.5106;0.5319;0.5532;0.5745;0.5957;0.617;0.6383;0.6596;0.6809;0.7021;0.7234;0.7447;0.766;0.7872;0.8085;0.8298;0.8511;0.8723;0.8936;0.9149;0.9362;0.9574;0.9787;1.0" dur="3.2s" begin="0.6s" calcMode="discrete" fill="freeze"/>
